name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm VoxType.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxType-windows
          path: dist/VoxType.exe

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/VoxType.exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/VoxType.exe --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }